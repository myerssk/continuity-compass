name: Continuity Compass CI

on:
  push:
    branches: [main, "fix/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint remediation files
        run: |
          bunx eslint src/lib/bcp/store.ts src/lib/bcp/storage-isolation.test.ts src/routes/_authenticated/route.tsx src/routes/_authenticated/account.tsx src/lib/account/workspaces.ts src/lib/bcp/cloud-state.ts src/lib/integrations/servicenow.ts src/routes/_authenticated/integrations.tsx src/components/bcp/AppShell.tsx src/integrations/supabase/types.ts --rule 'prettier/prettier: off'
      - name: Test
        run: bun run test --run
      - name: Build
        run: bun run build
