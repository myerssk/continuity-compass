name: Continuity Compass CI

on:
  push:
    branches: [main, "fix/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The imported Lovable baseline has substantial pre-existing Prettier debt.
      # Gate the security/remediation files now; baseline-wide formatting is a separate cleanup.
      - name: Lint remediation files
        run: bunx eslint --fix src/lib/bcp/store.ts src/lib/bcp/storage-isolation.test.ts src/routes/_authenticated/route.tsx && git diff --exit-code
      - name: Test
        run: bun run test --run
      - name: Build
        run: bun run build
